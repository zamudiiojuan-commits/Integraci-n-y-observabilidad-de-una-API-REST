# 1. CONEXIÓN A MYSQL (Con variables de entorno y respaldo local automático)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/biblioteca_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. HIBERNATE / JPA (En 'update' para conservar tus libros y autores)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. OBSERVABILIDAD (ACTUATOR Y PROMETHEUS HABILITADOS AL 100%)
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true

# 4. PUERTO, SERIALIZACIÓN JSON Y LOGS DE LA APLICACIÓN
server.port=8081
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false
spring.jackson.deserialization.FAIL_ON_UNKNOWN_PROPERTIES=false
logging.level.root=INFO
logging.level.com.biblioteca=INFO